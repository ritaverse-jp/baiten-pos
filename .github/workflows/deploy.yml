name: Deploy to GitHub Pages

# フロントは独立した静的 PWA として配信する方針（docs/requirements.md 5.2）に
# 従い、main への push のたびに typecheck・test・lint を通してから
# GitHub Pages にデプロイする（タスク20）。GAS 側のデプロイは対象外
# （こちらは npx clasp push / npx clasp redeploy を手動で行う運用のまま）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      # GitHub Pages はリポジトリ名のサブパスで配信するため、通常の
      # ローカルビルド（base: '/'）とは別に GITHUB_PAGES=true を渡す
      # （vite.config.ts 参照）
      - run: GITHUB_PAGES=true npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
